<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling List with Colors</title>
</head>
<style>
    ol {
     background-color: black;
     padding: 20px;
    }
    ol li {
     background-color: blue;
     color: white;
     padding: 10px;
     margin: 10px;
    }
    ul {
     background-color: pink;
     padding: 20px
    }
    ul li {
     background-color: yellow;
     color: black;
     padding: 10px;
     margin: 10px;
    }
</style>
<body>
<h1>STYLING LISTS WITH COLORS,MARGINS AND PADDING</h1>
<ol>
    <li>Apple</li>
    <li>Mango</li>
    <li>Kiwi</li>
</ol>
<ul>
    <li>Apple</li>
    <li>Mango</li>
    <li>KiwiS</li>
</ul>
</body>
</html>
