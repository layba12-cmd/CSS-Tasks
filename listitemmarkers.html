<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
</head>
<style>
ul.a {
    list-style-type: circle;
}
ul.b {
    list-style-type: disc;
}
ol.c {
    list-style-type: upper-roman;
}
ol.d {
    list-style-type: lower-roman;
}
</style>
<body>
<h2>LIST ITEM MARKERS</h2>
<p>Example of unordered lists:</p>
<ul class="a">
  <li>Pakistan</li>
  <li>India</li>
</ul>
<ul class="b">
  <li>Pakistan</li>
  <li>India</li>
</ul>
<p>Example of ordered lists:</p>
<ol class="c">
  <li>Pakistan</li>
  <li>India</li>
</ol>
<ol class="d">
  <li>Pakistan</li>
  <li>India</li>
</ol> 
</body>
</html>
